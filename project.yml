name: StashQuest
options:
  bundleIdPrefix: com.bradley
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  StashQuest:
    type: application
    platform: iOS
    sources:
      - StashQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bradley.stashquest
        INFOPLIST_KEY_CFBundleDisplayName: Stash Quest
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    info:
      path: StashQuest/Info.plist
      properties:
        NSUserNotificationsUsageDescription: Stash Quest can remind you about allowance, Coin Friday, and savings days.
